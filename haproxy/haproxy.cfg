# --------------------------------------------------
# haproxy.cfg
# HTTPS Load Balancer für Kubernetes Webserver Pods
# Round-Robin + Healthchecks
# --------------------------------------------------

global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

# --------------------------------------------------
# Kubernetes DNS Resolver
# (DAMIT HAProxy ALLE PODS FINDET)
# --------------------------------------------------
resolvers kube-dns
    nameserver dns 10.96.0.10:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

# --------------------------------------------------
# HTTPS Frontend
# --------------------------------------------------
frontend https_front
    mode http
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/fullchain.pem
    default_backend web_back

# --------------------------------------------------
# Backend – echtes Round Robin über alle Pods
# --------------------------------------------------
backend web_back
    mode http
    balance roundrobin

    option httpchk GET /health

    # Holt automatisch ALLE Pod-IP-Adressen
    server-template web 5 webserver-headless.default.svc.cluster.local:80 check resolvers kube-dns


